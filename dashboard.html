async function likatoDecrypt(b64, pw) {
  const raw = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const salt = raw.slice(8, 16), ct = raw.slice(16);
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  const bits = new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt, iterations: 200000, hash: 'SHA-256' }, base, 384));
  const key = await crypto.subtle.importKey('raw', bits.slice(0, 32), 'AES-CBC', false, ['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-CBC', iv: bits.slice(32, 48) }, key, ct));
}
async function unlock(pw, remember) {
  let html;
  try { html = await likatoDecrypt(PAYLOAD, pw); } catch (e) { return false; }
  if (!html.startsWith('<!--LIKATO-DASHBOARD-->')) return false;
  try { sessionStorage.setItem('likato_pw', pw); if (remember) localStorage.setItem('likato_pw', pw); } catch (e) {}
  document.open(); document.write(html); document.close();
  return true;
}
(async () => {
  let saved = null;
  try { saved = sessionStorage.getItem('likato_pw') || localStorage.getItem('likato_pw'); } catch (e) {}
  if (saved && await unlock(saved, false)) return;
  try { localStorage.removeItem('likato_pw'); } catch (e) {}
})();
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('btn'), err = document.getElementById('err');
  btn.disabled = true; btn.textContent = 'Проверяю…'; err.textContent = '';
  const ok = await unlock(document.getElementById('pw').value, document.getElementById('rem').checked);
  if (!ok) { btn.disabled = false; btn.textContent = 'Войти'; err.textContent = 'Неверный пароль'; document.getElementById('pw').select(); }
});
